<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Nexor · Simulador Tributário{% endblock %}</title>
  <!-- DEV: Tailwind Play CDN + HTMX. Na integração ao Nexor Fiscal, trocar pelo
       bundle compilado (static/css/tailwind.css) e pelos scripts do host. -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@2.0.3"></script>
</head>
<body class="min-h-screen bg-slate-50 text-slate-800">
  <div class="flex min-h-screen flex-col md:flex-row">
    <!-- Sidebar -->
    <aside class="w-full shrink-0 border-b border-slate-200 bg-white md:w-64 md:border-b-0 md:border-r">
      <div class="flex items-center gap-2 px-6 py-5">
        <span class="grid h-8 w-8 place-items-center rounded-lg bg-slate-900 text-sm font-bold text-white">N</span>
        <div class="leading-tight">
          <p class="text-sm font-semibold text-slate-900">Nexor Fiscal</p>
          <p class="text-xs text-slate-500">Simulador Tributário</p>
        </div>
      </div>
      <nav class="px-3 pb-4">
        {% set item = 'flex items-center gap-2 rounded-lg px-3 py-2 text-sm font-medium' %}
        <a href="/empresas"
           class="{{ item }} {{ 'bg-slate-900 text-white' if active == 'empresas' else 'text-slate-700 hover:bg-slate-100' }}">
          Empresas
        </a>
        <a href="/dashboard"
           class="{{ item }} {{ 'bg-slate-900 text-white' if active == 'dashboard' else 'text-slate-700 hover:bg-slate-100' }}">
          Dashboard
        </a>
        <a href="/referencia"
           class="{{ item }} {{ 'bg-slate-900 text-white' if active == 'referencia' else 'text-slate-700 hover:bg-slate-100' }}">
          Referência de créditos
        </a>
        <a href="/configuracoes"
           class="{{ item }} {{ 'bg-slate-900 text-white' if active == 'configuracoes' else 'text-slate-700 hover:bg-slate-100' }}">
          Configurações
        </a>
      </nav>
    </aside>

    <!-- Conteúdo -->
    <main class="flex-1 px-4 py-6 md:px-10 md:py-10">
      <div class="mx-auto max-w-3xl">
        {% block content %}{% endblock %}
      </div>
    </main>
  </div>
  {% block scripts %}{% endblock %}
</body>
</html>
