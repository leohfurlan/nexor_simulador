<tr class="border-t border-slate-100">
  <td class="px-3 py-2">
    <span class="font-medium text-slate-800">{{ row.competencia | month_year_pt }}</span>
    <input type="hidden" name="competencia" value="{{ row.competencia }}" />
  </td>
  <td class="px-3 py-2">
    <input type="number" step="0.01" min="0" name="faturamento"
           value="{{ '%.2f'|format(row.faturamento|float) }}"
           class="w-28 rounded border border-slate-300 px-2 py-1 text-sm" />
  </td>
  <td class="px-3 py-2">
    <input type="number" step="0.01" min="0" name="despesas_com_credito"
           value="{{ '%.2f'|format(row.despesas|float) }}"
           class="w-28 rounded border border-slate-300 px-2 py-1 text-sm" />
  </td>
  <td class="px-3 py-2">
    <input type="number" step="0.01" min="0" name="das_padrao_apurado"
           value="{{ '%.2f'|format(row.das|float) if row.das is not none else '' }}"
           placeholder="—" class="w-28 rounded border border-slate-300 px-2 py-1 text-sm" />
  </td>
  {% for reg in row.regimes %}
  <td class="px-3 py-2 text-right {{ 'rounded bg-emerald-50 font-semibold text-emerald-700' if reg.chave == row.recomendado else 'text-slate-700' }}">
    {% if reg.disponivel %}
      R$ {{ reg.imposto | brl }}
      {% if reg.pct is not none %}<br><span class="text-xs font-normal text-slate-400">{{ reg.pct | pct }}%</span>{% endif %}
    {% else %}
      <span class="text-slate-300">—</span>
    {% endif %}
  </td>
  {% endfor %}
  <td class="whitespace-nowrap px-3 py-2 text-right">
    <button hx-post="/empresas/{{ empresa.id }}/lancamentos" hx-include="closest tr"
            hx-target="#lancamentos-section" hx-swap="outerHTML"
            class="text-sm font-medium text-slate-900 hover:underline">Salvar</button>
    <button hx-post="/empresas/{{ empresa.id }}/lancamentos/{{ row.competencia }}/excluir"
            hx-target="#lancamentos-section" hx-swap="outerHTML"
            hx-confirm="Excluir a competência {{ row.competencia | month_year_pt }}?"
            class="ml-2 text-sm text-rose-600 hover:underline">Excluir</button>
  </td>
</tr>
